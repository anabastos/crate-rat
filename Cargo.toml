[package]
name = "craterat"
version = "0.1.0"
edition = "2021"
description = "A terminal crate manager for playlists, local paths, and SSH-backed drives"
license = "MIT"
readme = "README.md"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
lofty = "0.21"
image = "0.25"
ratatui-image = "1.0"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
rodio = "0.19"

[profile.release]
lto = true
codegen-units = 1
strip = true