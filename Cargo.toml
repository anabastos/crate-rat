[package]
name = "craterat"
version = "0.1.0"
edition = "2021"
description = "A terminal crate manager for playlists, local paths, and SSH-backed drives"
license = "MIT"
readme = "README.md"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
lofty = "0.21"
image = "0.25"
ratatui-image = "1.0"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
rodio = "0.19"
# Decodes playback audio ourselves (see src/player.rs): every common DJ format, including
# AAC/ALAC in .m4a — what tidal-dl-ng usually saves — which rodio's defaults can't play.
symphonia = { version = "0.5", features = ["all"] }
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
miniz_oxide = "0.8"

[target.'cfg(unix)'.dependencies]
# Only to point stderr at a log file while the TUI is up (see main.rs).
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# `cargo run` builds in debug mode, where the dependencies doing the startup work (lofty tag
# reads, serde_json, symphonia) are many times slower. Optimize them even in dev builds; our
# own crate stays unoptimized so it still compiles fast.
[profile.dev.package."*"]
opt-level = 3
